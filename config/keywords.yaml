# 优先级评分词表。改这个文件就能改排序,不用动代码。
# weight 是命中一次的基础分;标题命中 ×2,摘要命中 ×1(见 score.py)

tier_weights:
  T1: 3.0
  T2: 1.0
  T3: 0.0

thresholds:
  must_read: 7.0    # 必读 —— 2026-09-16 按 985 条真实数据的 p95 定,约每周 2 条
  recommended: 3.0  # 推荐;低于此为浏览(p75)

# 同组内重复命中的衰减系数与封顶(防止一篇泛泛谈马克思的文章靠堆词冲榜)
repeat_hit_factor: 0.35   # 组内第二个及之后的命中,只算 35%
group_cap_factor: 2.5     # 单组贡献上限 = 组权重 × 2.5

recency_bonus:
  within_days: 30
  points: 0.5

# 作者 watchlist:姓氏匹配(大小写不敏感,词边界),命中权重高
authors:
  weight: 3.0
  names:
    - Balibar
    - Rancière
    - Ranciere
    - Macherey
    - Badiou
    - Malabou
    - Bensaïd
    - Bensaid
    - Negri
    - Lazzarato
    - Poulantzas
    - Jameson
    - Honneth
    - Jaeggi
    - Postone
    - Tomba
    - Toscano
    - Bosteels
    - Read
    - Sotiris
    - Montag
    - Lahtinen
    - Goshgarian
    - Morfino
    - Ruda
    - Hamza
    - Žižek
    - Zizek

